# Levantar solo la BD para desarrollo:  docker compose up -d db
# Levantar todo (BD + API + web):       docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-origenes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-origenes}
      POSTGRES_DB: ${POSTGRES_DB:-origenes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro   # ejecuta 01_schema.sql solo la primera vez
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-origenes} -d ${POSTGRES_DB:-origenes}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-origenes}:${POSTGRES_PASSWORD:-origenes}@db:5432/${POSTGRES_DB:-origenes}}
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET debe estar definido en el archivo .env}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "${PORT:-3000}:3000"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
