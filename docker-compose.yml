# Levantar solo la BD para desarrollo:  docker compose up -d db
# Levantar todo (BD + API + web):       docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Error: POSTGRES_USER debe estar definido en el archivo .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD debe estar definido en el archivo .env}"
      POSTGRES_DB: "${POSTGRES_DB:?Error: POSTGRES_DB debe estar definido en el archivo .env}"
      WEB_DB_PASSWORD: "${WEB_DB_PASSWORD:?Error: WEB_DB_PASSWORD debe estar definido en el archivo .env}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro   # ejecuta 01_schema.sql solo la primera vez
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Error} -d ${POSTGRES_DB:?Error}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: db
      DB_PORT: 5437
      DB_USER: "${WEB_DB_USER:-web_user}"
      DB_PASSWORD: "${WEB_DB_PASSWORD:?Error: WEB_DB_PASSWORD debe estar definido en el archivo .env}"
      DB_NAME: "${POSTGRES_DB:?Error: POSTGRES_DB debe estar definido en el archivo .env}"
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET debe estar definido en el archivo .env}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    ports: ["8080:80"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
